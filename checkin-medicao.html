<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar medição - Geratrix</title>
    <link rel="stylesheet" href="css/base/style.css">
    <link rel="stylesheet" href="css/layout/page.css">
    <link rel="stylesheet" href="css/layout/back.css">
    <link rel="stylesheet" href="css/components/form.css">
    <link rel="stylesheet" href="css/components/button.css">
    <link rel="stylesheet" href="css/components/badge.css">
</head>

<body>
    <div class="page">
        <a class="back" href="lista.html">← Voltar</a>

        <header class="page__header">
            <h1 class="page__title">Maria das Graças</h1>
            <p class="page__subtitle">Pressão arterial · 09:00</p>
            <span class="badge badge--warning">Pendente</span>
        </header>

        <main>
            <h2 class="page__section-title">Registrar medição</h2>

            <form class="form">
                <div class="form__group">
                    <label class="form__label" for="pressao-sistolica">
                        Pressão sistólica (mmHg)
                    </label>
                    <!-- Valor e faixa ilustrativos do guia; o alerta é um estado estático. -->
                    <input
                        class="form__input form__input--invalid"
                        type="number"
                        id="pressao-sistolica"
                        name="pressao_sistolica"
                        inputmode="numeric"
                        step="1"
                        value="160"
                        aria-invalid="true"
                        aria-describedby="referencia-medicao alerta-medicao"
                    >
                    <p class="form__hint" id="referencia-medicao">
                        Referência: 90–140 mmHg
                    </p>
                    <p class="form__error" id="alerta-medicao">
                        <span class="badge badge--alert">Fora da faixa de referência</span>
                    </p>
                </div>

                <div class="form__group">
                    <label class="form__label" for="observacao">
                        Observação (opcional)
                    </label>
                    <textarea
                        class="form__input form__textarea"
                        id="observacao"
                        name="observacao"
                        rows="4"
                        placeholder="Acrescente detalhes sobre a medição."
                    ></textarea>
                </div>

                <div class="form__actions">
                    <button class="button button--primary button--block" type="button">
                        Registrar medição
                    </button>
                    <a class="button button--block" href="lista.html">
                        Cancelar
                    </a>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
