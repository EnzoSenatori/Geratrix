<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geratrix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/user-list.css">
    <link rel="stylesheet" href="css/avatar.css">
</head>

<body>
    <div class="page page--no-back">
        <header class="page__header">
            <h1 class="page__title">Geratrix</h1>
            <p class="page__subtitle">Gestão de cuidado em ILPI</p>
        </header>

        <main>
            <h2 class="page__section-title">Quem está abrindo o turno?</h2>
            <ul class="user-list">
                <li class="user-list__item">
                    <a class="card" href="pin.html">
                        <div class="avatar">TCM</div>
                        <div class="card__info">
                            <h3 class="card__title">Têo Casella Mendonça</h3>
                            <p class="card__text">Cuidador - Turno Manhã</p>
                        </div>
                    </a>
                </li>
                <li class="user-list__item">
                    <a class="card" href="pin.html">
                        <div class="avatar">ES</div>
                        <div class="card__info">
                            <h3 class="card__title">Enzão</h3>
                            <p class="card__text">Cuidador - Turno Tarde</p>
                        </div>
                    </a>
                </li>
                <li class="user-list__item">
                    <a class="card" href="pin.html">
                        <div class="avatar">RC</div>
                        <div class="card__info">
                            <h3 class="card__title">Rafael Lord Corrêa</h3>
                            <p class="card__text">Cuidador - Turno Noite</p>
                        </div>
                    </a>
                </li>
                <li class="user-list__item">
                    <a class="card" href="pin.html">
                        <div class="avatar">GD</div>
                        <div class="card__info">
                            <h3 class="card__title">Gestor - Direção</h3>
                            <p class="card__text">Acesso gerencial</p>
                        </div>

                </li>
            </ul>

    </div>

</html>
