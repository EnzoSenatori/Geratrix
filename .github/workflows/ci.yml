# CI do Geratrix: testes da API, provas OWASP (A01, A08) e compilação do Flutter web. Sem deploy.
name: CI

on:
  push:
    branches: [tcm/flutter-backend, developer, main]
  pull_request:
    branches: [tcm/flutter-backend, developer, main]

permissions:
  contents: read

# Um novo push na mesma branch cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Mesma versão do Python do Azure App Service
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      # Testes da API num banco temporário (nunca o backend/geratrix.db)
      - name: Testes da API
        run: python -m unittest discover -s testes -v

      # Falha se alguma prova não mostrar PROTEGIDO ou acusar VULNERÁVEL/FALHOU
      - name: Provas OWASP A01 e A08
        run: python testes/rodar_provas.py

  flutter:
    name: Flutter (analyze e build web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: geratrix_flutter
    steps:
      - uses: actions/checkout@v7

      # Mesma versão usada localmente
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Versão do Flutter
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      # Só confere que compila: sem MQTT_SENHA, e o build não é publicado nem commitado
      - name: Build web
        run: flutter build web --release --base-href /app/
