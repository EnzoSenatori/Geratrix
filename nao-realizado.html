<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Não realizado - Geratrix</title>
    <link rel="stylesheet" href="css/base/style.css">
    <link rel="stylesheet" href="css/layout/page.css">
    <link rel="stylesheet" href="css/layout/back.css">
    <link rel="stylesheet" href="css/components/form.css">
    <link rel="stylesheet" href="css/components/button.css">
    <link rel="stylesheet" href="css/components/badge.css">
</head>

<body>
    <div class="page">
        <a class="back" href="checkin-tarefa.html">← Voltar</a>

        <header class="page__header">
            <h1 class="page__title">Maria das Graças</h1>
            <p class="page__subtitle">Higiene oral · 10:30</p>
            <span class="badge badge--warning">Não realizado</span>
        </header>

        <main>
            <h2 class="page__section-title">Justificar não realização</h2>

            <form class="form">
                <div class="form__group" role="radiogroup" aria-labelledby="motivo-label">
                    <span class="form__label" id="motivo-label">Motivo</span>

                    <!-- Estado visual selecionado para este protótipo estático. -->
                    <label class="form__option form__option--checked">
                        <input type="radio" name="motivo" value="recusa" checked>
                        <span class="form__option-text">Recusa do residente</span>
                    </label>

                    <label class="form__option">
                        <input type="radio" name="motivo" value="dormindo">
                        <span class="form__option-text">Residente dormindo</span>
                    </label>

                    <label class="form__option">
                        <input type="radio" name="motivo" value="material-indisponivel">
                        <span class="form__option-text">Material indisponível</span>
                    </label>

                    <label class="form__option">
                        <input type="radio" name="motivo" value="emergencia">
                        <span class="form__option-text">Emergência</span>
                    </label>
                </div>

                <div class="form__group">
                    <label class="form__label" for="observacao">
                        Observação (opcional)
                    </label>
                    <textarea
                        class="form__input form__textarea"
                        id="observacao"
                        name="observacao"
                        rows="4"
                        placeholder="Acrescente detalhes sobre o motivo."
                    ></textarea>
                </div>

                <div class="form__actions">
                    <button class="button button--primary button--block" type="button">
                        Registrar justificativa
                    </button>
                    <a class="button button--block" href="checkin-tarefa.html">
                        Cancelar
                    </a>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
