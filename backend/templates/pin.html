<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geratrix</title>
    <link rel="stylesheet" href="/css/base/style.css">
    <link rel="stylesheet" href="/css/layout/page.css">
    <link rel="stylesheet" href="/css/layout/back.css">
    <link rel="stylesheet" href="/css/components/avatar.css">
    <link rel="stylesheet" href="/css/components/button.css">
    <link rel="stylesheet" href="/css/components/pin-user.css">
    <link rel="stylesheet" href="/css/components/pin-display.css">
    <link rel="stylesheet" href="/css/components/keypad.css">
    <link rel="stylesheet" href="/css/components/form.css">
</head>

<body>
    <div class="page">
        <a class="back" href="/">← Voltar</a>
        <header class="page__header">
            <h1 class="page__title">Login</h1>
            <p class="page__subtitle">Insira seu código de acesso</p>
        </header>

        <main>
            <div class="pin-user">
                <div class="avatar">{{ cuidador.iniciais }}</div>
                <p class="pin-user__name">{{ cuidador.nome }}</p>
            </div>

            <h2 class="page__section-title">PIN</h2>

            <div class="pin-display">
                {% for n in range(4) %}
                <span class="pin-display__dot {% if n < preenchidos %}pin-display__dot--filled{% endif %}"></span>
                {% endfor %}
            </div>

            {% if erro %}
            <p class="form__error" style="text-align: center;">{{ erro }}</p>
            {% endif %}

            <form method="post">
                <div class="keypad">
                    <button class="keypad__key" type="submit" name="tecla" value="1">1</button>
                    <button class="keypad__key" type="submit" name="tecla" value="2">2</button>
                    <button class="keypad__key" type="submit" name="tecla" value="3">3</button>
                    <button class="keypad__key" type="submit" name="tecla" value="4">4</button>
                    <button class="keypad__key" type="submit" name="tecla" value="5">5</button>
                    <button class="keypad__key" type="submit" name="tecla" value="6">6</button>
                    <button class="keypad__key" type="submit" name="tecla" value="7">7</button>
                    <button class="keypad__key" type="submit" name="tecla" value="8">8</button>
                    <button class="keypad__key" type="submit" name="tecla" value="9">9</button>
                    <button class="keypad__key keypad__key--empty" type="button" disabled></button>
                    <button class="keypad__key" type="submit" name="tecla" value="0">0</button>
                    <button class="keypad__key keypad__key--action" type="submit" name="tecla" value="apagar">←</button>
                </div>

                <button class="button button--primary button--block" type="submit" name="tecla" value="entrar">Entrar</button>
            </form>
        </main>
    </div>
</body>

</html>
