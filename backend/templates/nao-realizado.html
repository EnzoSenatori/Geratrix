<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geratrix - Não realizado</title>
    <link rel="stylesheet" href="/css/base/reset.css">
    <link rel="stylesheet" href="/css/base/variables.css">
    <link rel="stylesheet" href="/css/base/typography.css">
    <link rel="stylesheet" href="/css/layout/app.css">
    <link rel="stylesheet" href="/css/components/badge.css">
    <link rel="stylesheet" href="/css/components/button.css">
    <link rel="stylesheet" href="/css/components/form.css">
</head>
<body>
    <div class="app">
        <header class="app_header">
            <a href="/checkin/{{ item.id }}" class="button button--icon" style="text-decoration: none;">←</a>
            <h1 class="app_title" style="margin-top: 12px;">{{ item.residente }}</h1>
            <p class="app_subtitle">{{ item.tipo }} • {{ item.horario }}</p>
            <div style="margin-top: 8px;">
                {% if status_item == 'Atrasado' %}
                <span class="badge badge--alert">Atrasado</span>
                {% else %}
                <span class="badge badge--warning">Pendente</span>
                {% endif %}
            </div>
        </header>

        <main class="app_content">
            {% if erro %}
            <p class="form_error" style="color: #d9534f; font-weight: bold; margin-bottom: 16px;">{{ erro }}</p>
            {% endif %}

            <form class="form" method="post">
                <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px;">
                    <label style="font-weight: 500; font-size: 14px;">Motivo (obrigatório)</label>
                    {% for chave, texto in motivos.items() %}
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                        <input type="radio" name="motivo" value="{{ chave }}">
                        {{ texto }}
                    </label>
                    {% endfor %}
                </div>

                <div style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
                    <label for="observacao" style="font-weight: 500; font-size: 14px;">Observação (opcional)</label>
                    <textarea id="observacao" name="observacao" rows="3" placeholder="Digite aqui..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
                </div>

                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button type="submit" class="button button--primary button--block">Confirmar não realização</button>
                    <a href="/checkin/{{ item.id }}" class="button button--secondary button--block" style="text-decoration: none; text-align: center; display: block; width: 100%;">Cancelar</a>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
