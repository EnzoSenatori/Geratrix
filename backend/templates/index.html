<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geratrix</title>
    <link rel="stylesheet" href="/css/base/style.css">
    <link rel="stylesheet" href="/css/layout/page.css">
    <link rel="stylesheet" href="/css/components/avatar.css">
    <link rel="stylesheet" href="/css/components/card.css">
    <link rel="stylesheet" href="/css/components/user-list.css">
</head>

<body>
    <div class="page page--no-back">
        <header class="page__header">
            <h1 class="page__title">Geratrix</h1>
            <p class="page__subtitle">Gestão de cuidado em ILPI</p>
        </header>

        <main>
            <h2 class="page__section-title">Quem está abrindo o turno?</h2>
            <ul class="user-list">
                {% for c in cuidadores %}
                <li class="user-list__item">
                    <a class="card" href="/pin/{{ c.id }}">
                        <div class="avatar">{{ c.iniciais }}</div>
                        <div class="card__info">
                            <h3 class="card__title">{{ c.nome }}</h3>
                            <p class="card__text">Cuidador - Turno {{ c.turno_padrao }}</p>
                        </div>
                    </a>
                </li>
                {% endfor %}
            </ul>
        </main>
    </div>
</body>

</html>
